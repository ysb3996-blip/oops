<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>oops: copy the last shell command and its output as a paste-ready block</title>
  <rect width="1280" height="640" fill="#FBF8F3"/>

  <!-- left: name and tagline -->
  <g transform="translate(88 150)">
    <rect x="0" y="0" width="84" height="84" rx="20" fill="#E5533D"/>
    <circle cx="42" cy="42" r="15" fill="#fff"/>
    <text x="112" y="72" font-size="92" font-weight="800" fill="#2B2B2B" letter-spacing="-2">oops</text>

    <text x="0" y="176" font-size="36" font-weight="700" fill="#2B2B2B">Copy the last shell command</text>
    <text x="0" y="224" font-size="36" font-weight="700" fill="#2B2B2B">and its output. Paste anywhere.</text>

    <text x="0" y="292" font-size="24" fill="#6B6B6B">Secrets masked. zsh and bash. macOS and Linux.</text>

    <rect x="0" y="330" width="372" height="60" rx="12" fill="#fff" stroke="#EDE6DC" stroke-width="2"/>
    <text x="24" y="369" font-family="Menlo, Consolas, monospace" font-size="24" fill="#2B2B2B">$ gem install oops-cli</text>
  </g>

  <!-- right: terminal -->
  <g transform="translate(716 96)">
    <rect x="0" y="0" width="476" height="272" rx="16" fill="#2B2B2B"/>
    <circle cx="26" cy="24" r="7" fill="#FF5F57"/><circle cx="48" cy="24" r="7" fill="#FEBC2E"/><circle cx="70" cy="24" r="7" fill="#28C840"/>
    <g font-family="Menlo, Consolas, monospace" font-size="20">
      <text x="28" y="72" fill="#9FE6A0">$ bundle exec rspec</text>
      <text x="28" y="104" fill="#fff">....F</text>
      <text x="28" y="136" fill="#fff">1) User#name returns full name</text>
      <text x="28" y="168" fill="#FF8A80">   expected "Taro", got nil</text>
      <text x="28" y="216" fill="#9FE6A0">$ oops</text>
      <text x="28" y="248" fill="#fff">copied: $ bundle exec rspec (3 lines)</text>
    </g>
  </g>

  <!-- clipboard card overlapping the terminal -->
  <g transform="translate(776 356)">
    <rect x="6" y="8" width="400" height="176" rx="14" fill="#E9E1D6"/>
    <rect x="0" y="0" width="400" height="176" rx="14" fill="#fff" stroke="#E5533D" stroke-width="3"/>
    <rect x="150" y="-14" width="100" height="26" rx="8" fill="#E5533D"/>
    <text x="200" y="5" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">clipboard</text>
    <g font-family="Menlo, Consolas, monospace" font-size="18" fill="#2B2B2B">
      <text x="24" y="44" fill="#9A9A9A">```</text>
      <text x="24" y="72">$ bundle exec rspec</text>
      <text x="24" y="100">....F</text>
      <text x="24" y="128">1) User#name returns full name</text>
      <text x="24" y="156" fill="#9A9A9A">```</text>
    </g>
    <rect x="282" y="80" width="94" height="30" rx="8" fill="#FDECE8"/>
    <text x="329" y="101" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#C8432F">[secret]</text>
  </g>

  <text x="88" y="588" font-size="22" fill="#9A9A9A">github.com/ysb3996-blip/oops</text>
</svg>
