<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>oops の仕組み</title>
  <desc>4つのステップ: いつも通りコマンドを打つと、小さな録音機があなたとシェルの間で動いている。コマンドと出力はディスク上のノートに書かれる。oops と打つと最後のページを写し、秘密を隠してコードブロックにする。それをどこにでも貼れる。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#B8B0A6"/>
    </marker>
  </defs>

  <rect width="1400" height="760" rx="24" fill="#FBF8F3"/>

  <!-- ===== 1: いつも通り打つだけ ===== -->
  <g transform="translate(40 40)">
    <rect width="640" height="320" rx="20" fill="#fff" stroke="#EDE6DC" stroke-width="2"/>
    <circle cx="56" cy="52" r="24" fill="#E5533D"/>
    <text x="56" y="61" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">1</text>
    <text x="96" y="61" font-size="28" font-weight="700" fill="#2B2B2B">いつも通り打つだけ</text>

    <g transform="translate(56 110)">
      <rect x="0" y="0" width="130" height="60" rx="10" fill="#fff" stroke="#2B2B2B" stroke-width="3"/>
      <g fill="#2B2B2B">
        <rect x="14" y="13" width="12" height="10" rx="2"/><rect x="32" y="13" width="12" height="10" rx="2"/><rect x="50" y="13" width="12" height="10" rx="2"/><rect x="68" y="13" width="12" height="10" rx="2"/><rect x="86" y="13" width="12" height="10" rx="2"/><rect x="104" y="13" width="12" height="10" rx="2"/>
        <rect x="23" y="29" width="12" height="10" rx="2"/><rect x="41" y="29" width="12" height="10" rx="2"/><rect x="59" y="29" width="12" height="10" rx="2"/><rect x="77" y="29" width="12" height="10" rx="2"/><rect x="95" y="29" width="12" height="10" rx="2"/>
        <rect x="35" y="45" width="60" height="6" rx="2"/>
      </g>
    </g>
    <line x1="196" y1="140" x2="232" y2="140" stroke="#B8B0A6" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(242 104)">
      <rect x="0" y="0" width="76" height="72" rx="12" fill="#fff" stroke="#E5533D" stroke-width="3"/>
      <circle cx="38" cy="30" r="12" fill="#E5533D"/>
      <text x="38" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#E5533D">REC</text>
    </g>
    <line x1="328" y1="140" x2="364" y2="140" stroke="#B8B0A6" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(374 92)">
      <rect x="0" y="0" width="210" height="96" rx="10" fill="#2B2B2B"/>
      <circle cx="16" cy="15" r="5" fill="#FF5F57"/><circle cx="32" cy="15" r="5" fill="#FEBC2E"/><circle cx="48" cy="15" r="5" fill="#28C840"/>
      <g font-family="Menlo, Consolas, monospace" font-size="15">
        <text x="14" y="46" fill="#9FE6A0">$ bundle exec rspec</text>
        <text x="14" y="66" fill="#fff">....F</text>
        <text x="14" y="86" fill="#FF8A80">(exit 1)</text>
      </g>
    </g>

    <text x="56" y="232" font-size="21" fill="#2B2B2B">小さな録音機が、あなたとシェルの間にいます。</text>
    <text x="56" y="268" font-size="21" fill="#6B6B6B">見た目は何も変わりません。同じプロンプト、</text>
    <text x="56" y="296" font-size="21" fill="#6B6B6B">同じ色、同じ速さです。</text>
  </g>

  <!-- ===== 2: メモを取る ===== -->
  <g transform="translate(720 40)">
    <rect width="640" height="320" rx="20" fill="#fff" stroke="#EDE6DC" stroke-width="2"/>
    <circle cx="56" cy="52" r="24" fill="#E5533D"/>
    <text x="56" y="61" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">2</text>
    <text x="96" y="61" font-size="28" font-weight="700" fill="#2B2B2B">こっそりメモを取る</text>

    <g transform="translate(120 92)">
      <rect x="0" y="0" width="230" height="110" rx="8" fill="#fff" stroke="#2B2B2B" stroke-width="3"/>
      <line x1="34" y1="0" x2="34" y2="110" stroke="#E5533D" stroke-width="2"/>
      <g fill="#2B2B2B">
        <circle cx="12" cy="22" r="5"/><circle cx="12" cy="55" r="5"/><circle cx="12" cy="88" r="5"/>
      </g>
      <g font-family="Menlo, Consolas, monospace" font-size="14">
        <text x="46" y="26" fill="#9A9A9A">$ git push</text>
        <text x="46" y="46" fill="#9A9A9A">done</text>
        <text x="46" y="70" fill="#2B2B2B">$ bundle exec rspec</text>
        <text x="46" y="90" fill="#2B2B2B">....F  <tspan fill="#E5533D">(exit 1)</tspan></text>
      </g>
    </g>

    <g transform="translate(400 112)">
      <rect x="0" y="26" width="56" height="44" rx="8" fill="#fff" stroke="#2B2B2B" stroke-width="3"/>
      <path d="M13 26 V16 a15 15 0 0 1 30 0 V26" fill="none" stroke="#2B2B2B" stroke-width="3"/>
      <circle cx="28" cy="48" r="5" fill="#2B2B2B"/>
      <text x="28" y="94" text-anchor="middle" font-size="14" fill="#6B6B6B">自分だけ</text>
    </g>

    <text x="56" y="232" font-size="21" fill="#2B2B2B">コマンドと出力が、1つずつページに書かれます。</text>
    <text x="56" y="268" font-size="21" fill="#6B6B6B">ノートはあなたのディスクの中に、タブごとに1冊。</text>
    <text x="56" y="296" font-size="21" fill="#6B6B6B">どこにも送られません。</text>
  </g>

  <!-- ===== 3: oops と打つ ===== -->
  <g transform="translate(40 400)">
    <rect width="640" height="320" rx="20" fill="#fff" stroke="#EDE6DC" stroke-width="2"/>
    <circle cx="56" cy="52" r="24" fill="#E5533D"/>
    <text x="56" y="61" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">3</text>
    <text x="96" y="61" font-size="28" font-weight="700" fill="#2B2B2B"><tspan font-family="Menlo, Consolas, monospace" fill="#E5533D">oops</tspan> と打つ</text>

    <g transform="translate(56 92)">
      <rect x="0" y="0" width="200" height="110" rx="8" fill="#fff" stroke="#2B2B2B" stroke-width="3"/>
      <g font-family="Menlo, Consolas, monospace" font-size="14" fill="#2B2B2B">
        <text x="14" y="28">$ bundle exec rspec</text>
        <text x="14" y="50">....F</text>
        <text x="14" y="74">key=</text>
        <rect x="52" y="62" width="76" height="17" rx="3" fill="#2B2B2B"/>
        <text x="90" y="74" text-anchor="middle" font-size="11" fill="#fff">[secret]</text>
        <text x="14" y="98" fill="#E5533D">(exit 1)</text>
      </g>
    </g>
    <line x1="266" y1="148" x2="302" y2="148" stroke="#B8B0A6" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(312 84)">
      <rect x="0" y="12" width="110" height="118" rx="10" fill="#fff" stroke="#2B2B2B" stroke-width="3"/>
      <rect x="34" y="0" width="42" height="22" rx="5" fill="#E5533D"/>
      <g font-family="Menlo, Consolas, monospace" font-size="14" fill="#2B2B2B">
        <text x="14" y="50">```</text>
        <text x="14" y="70">$ bundle…</text>
        <text x="14" y="90">....F</text>
        <text x="14" y="110">```</text>
      </g>
    </g>

    <text x="56" y="232" font-size="21" fill="#2B2B2B">最後のページを写し、鍵やトークンを隠して、</text>
    <text x="56" y="260" font-size="21" fill="#2B2B2B">コードブロックの形でクリップボードに置きます。</text>
    <text x="56" y="296" font-size="21" fill="#6B6B6B">コマンドをもう一度実行することはありません。</text>
  </g>

  <!-- ===== 4: どこにでも貼れる ===== -->
  <g transform="translate(720 400)">
    <rect width="640" height="320" rx="20" fill="#fff" stroke="#EDE6DC" stroke-width="2"/>
    <circle cx="56" cy="52" r="24" fill="#E5533D"/>
    <text x="56" y="61" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">4</text>
    <text x="96" y="61" font-size="28" font-weight="700" fill="#2B2B2B">どこにでも貼れる</text>

    <g transform="translate(56 90)">
      <path d="M0 14 a14 14 0 0 1 14 -14 H236 a14 14 0 0 1 14 14 V90 a14 14 0 0 1 -14 14 H60 L32 128 V104 H14 a14 14 0 0 1 -14 -14 Z" fill="#fff" stroke="#2B2B2B" stroke-width="3"/>
      <text x="18" y="32" font-size="17" fill="#2B2B2B">なんで失敗するの？</text>
      <g font-family="Menlo, Consolas, monospace" font-size="14" fill="#2B2B2B">
        <text x="18" y="58">$ bundle exec rspec</text>
        <text x="18" y="78">....F</text>
        <text x="18" y="98" fill="#E5533D">(exit 1)</text>
      </g>
    </g>

    <g transform="translate(350 100)" font-size="18" fill="#2B2B2B">
      <rect x="0" y="0" width="230" height="34" rx="17" fill="#FBF8F3" stroke="#EDE6DC" stroke-width="2"/><text x="115" y="24" text-anchor="middle">チャット AI</text>
      <rect x="0" y="44" width="230" height="34" rx="17" fill="#FBF8F3" stroke="#EDE6DC" stroke-width="2"/><text x="115" y="68" text-anchor="middle">Slack や同僚</text>
      <rect x="0" y="88" width="230" height="34" rx="17" fill="#FBF8F3" stroke="#EDE6DC" stroke-width="2"/><text x="115" y="112" text-anchor="middle">GitHub の issue</text>
    </g>

    <text x="56" y="260" font-size="21" fill="#2B2B2B">Cmd-V で、コマンド・出力・終了コードが</text>
    <text x="56" y="288" font-size="21" fill="#2B2B2B">そのまま読める形で相手に届きます。</text>
  </g>
</svg>
