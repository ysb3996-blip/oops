name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels its older run; runs on main are kept.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.os }} / Ruby ${{ matrix.ruby }}
    runs-on: ${{ matrix.os }}
    # id-token lets the Codecov upload sign in with OIDC instead of a stored token.
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Ruby 3.5 was released as 4.0 ("3.5" only matches 3.5.0-preview1).
        ruby: ["3.3", "3.4", "4.0"]
        # macOS runners are scarce and often queue for long; the oldest and
        # newest Ruby there are enough, the middle one runs on Linux only.
        exclude:
          - os: macos-latest
            ruby: "3.4"
    steps:
      - uses: actions/checkout@v7
      - name: Install zsh and fish
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - name: Install fish
        if: runner.os == 'macOS'
        run: brew install fish
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test
        env:
          COVERAGE: ${{ matrix.os == 'ubuntu-latest' && matrix.ruby == '3.3' && '1' || '' }}
      # Pull requests from forks get no OIDC token, so a failed upload must not fail CI.
      - uses: codecov/codecov-action@v7
        if: matrix.os == 'ubuntu-latest' && matrix.ruby == '3.3'
        with:
          files: coverage/coverage.xml
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false
      - run: bundle exec rubocop
      - run: gem build oops-cli.gemspec

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # zsh is not supported by shellcheck; only the bash snippet is checked.
      - run: shellcheck -S warning lib/oops/shell/oops.bash bin/setup
